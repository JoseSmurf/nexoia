# ─── ADR-001: Integração com Pipeline ──────────────────────────────────────────
# TODO(Fase 3): Conectar nexoia-core ao pipeline principal (src/pipeline.rs).
#   atualmente, nexoia-core é um subsistema isolado que compila e testa de forma
#   independente do root workspace (crates/host, crates/wasm_cortex).
#
#   Contrato de integração:
#   ┌──────────────────────┬────────────────────────────────────────────────┐
#   │ crate               │ ponto de conexão no pipeline                   │
#   ├──────────────────────┼────────────────────────────────────────────────┤
#   │ bio_loop::digest    │ substituir evidence_hash pipeline atual         │
#   │ epoch_mmr::mmr      │ append(hash) + seal_epoch() → ZkProver         │
#   │ zk_prover           │ consolidate(seal) → prove_inclusion()          │
#   │ gossip              │ broadcast(proof) + ingest(NetworkFrame)        │
#   └──────────────────────┴────────────────────────────────────────────────┘
#   Quando integrado, remover o workspace aninhado e fundir no root.
# ────────────────────────────────────────────────────────────────────────────────

[workspace]
resolver = "2"
members = [
    "bio_loop",
    "epoch_mmr",
    "zk_prover",
    "gossip",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["NexoIA Engineering"]
license     = "MIT"

# ─── Dependências Globais do Workspace ────────────────────────────────────────
# Declaradas aqui e referenciadas via `{ workspace = true }` nos crates filhos.
# Isso garante versão única e zero conflito de resolução em todo o grafo.

[workspace.dependencies]

# Membrana MPSC de alta performance — canais lock-free baseados em Epoch-Based
# Reclamation (EBR). Substitui std::sync::mpsc com zero bloqueios no caminho crítico.
crossbeam-channel = "0.5"

# Primitiva criptográfica base — hashing SHA-256/SHA-512 para assinaturas, IDs
# de fragmentos e raízes das épocas no DAG do epoch_mmr.
sha2 = "0.10"

# Verifiable Delay Function (Chia VDF) — prova de tempo verificável para defesa
# Sybil no protocolo de gossip. Impede que nós falsos dominem a rede ao exigir
# trabalho computacional sequencial que não pode ser paralelizado.
chiavdf = "1.1"

# ─── Perfis de Compilação ─────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "thin"       # Link-Time Optimization entre crates do workspace
codegen-units = 1            # Maximiza inlining cross-crate
strip         = "symbols"    # Remove debug symbols no binário final
panic         = "abort"      # Sem unwind overhead no caminho crítico

[profile.dev]
opt-level = 1                # Velocidade mínima de compilação incremental
